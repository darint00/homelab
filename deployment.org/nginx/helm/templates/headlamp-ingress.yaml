apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp-ui
  namespace: headlamp
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /headlamp(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: headlamp
                port:
                  number: 80
